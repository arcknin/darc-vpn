limitations:
  - SSH login as codex is verified, but WireGuard configuration and peer details are inaccessible to that account; published terms with operator/retention and exact dashboard/API hostname remain unavailable.
  - codex belongs to the docker group despite lacking sudo; this grants broad host authority and needs an explicit owner decision before relying on the account as restricted access.
  - Owner-provided summary does not reveal the contents of PostUp/PostDown hooks or establish NAT/firewall equivalence; counts of rules mentioning wg0 do not prove absence of masquerade elsewhere. One peer had a handshake within 24 hours, so cutover has an active-client interruption risk.
  - Sanitized hook classification confirms tool/chain/interface/target only, not the exact predicates, rule order, or whether duplicate FORWARD entries come from wg-quick or another process. IPv6 behavior in Docker bridge remains to be verified.
  - The existing Docker default bridge lacks IPv6; a purpose-built network and IPv6 routing/NAT design must be tested. Known wg0 interface addresses do not overlap 172.17.0.0/16, but uninspected peer AllowedIPs could still affect routing.
  - Existing broad and duplicate host NAT/firewall rules must not be copied or deleted blindly; rule ownership, IPv6 ingress policy, and exact rollback steps remain unverified.
  - The host IPv6 HTTPS check does not prove IPv6 for a WireGuard container or client. Backend-generated IPv4 addresses can collide, and current IPv6 client profiles have no assigned client IPv6 address; these are live integration blockers, not resolved by Docker networking alone.
  - A test WireGuard container would validate infrastructure only; it would not validate backend-created profiles or revocation until a real add/remove/confirm controller and address allocation are implemented.
  - Lab demonstrated containerized handshake, bidirectional packets, and selected IPv4/IPv6 internet egress. The first IPv6 attempt failed without a retained error and its cause remains unknown; the later successful attempt used www.cloudflare.com. No independent external-client reachability, persistence across restart, backend integration, or production cutover was tested.
  - The Mac profile is a temporary credential stored locally in /private/tmp; remove it after testing. The external lab expires at 2026-09-29T16:11:11Z. Its nohup cleanup survived logout verification but not necessarily VPS reboot; restart=no prevents server restart after reboot. External handshake is verified; tunnel IPv4/IPv6 traffic still needs Mac ping results.
  - QR export exposes a reusable WireGuard credential; encryption and key-management details remain unplanned.
  - Local backend and dashboard evidence exists; no Android APK, browser E2E, live WireGuard integration, DNS, deployment, or production validation.
blocker: The isolated WG container feasibility test passed selected IPv4/IPv6 paths, but the owner-requested live move needs a separate feature-contract/operations decision and plan; backend address uniqueness, IPv6 client behavior, peer provisioning, revocation reconciliation, independent external-client validation, persistence, host firewall ownership, backup, and rollback remain unresolved. Local B06 validation remains independent.
